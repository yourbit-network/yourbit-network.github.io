title = "Yourbit website secret scanning"
[extend]
useDefault = true

[[rules]]
id = "notibuddy-token"
description = "NotiBuddy sender/device credentials"
regex = '''\bnb_[a-z]+_(?:live|test)_[A-Za-z0-9_-]{8,}\b'''

[[rules]]
id = "notibuddy-pairing-bundle"
description = "Encoded NotiBuddy pairing credentials"
regex = '''nbpair1\.[A-Za-z0-9_-]{50,}'''
